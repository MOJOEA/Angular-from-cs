<header class="bg-zinc-950 text-zinc-100 shadow-xl border-b border-zinc-800 sticky top-0 z-50 font-sans w-full">
  <div class="w-full px-12 sm:px-4 lg:px-6">
    <div class="flex items-center justify-between h-16 w-full">
      
      <!-- LOGO & APP TITLE -->
      <div class="flex items-center space-x-1">
        <img 
          src="icon.png" 
          alt="App Logo" 
          class="w-10 h-10 object-contain"
        />
        <span class="text-[24px] font-bold tracking-wide">
          Game of Thrones
        </span>
      </div>

      <!-- NAVIGATION LINKS -->
      <nav class="flex items-center space-x-1">
        
        <!-- BUTTON HOME WITH DROPDOWN -->
        <div class="relative inline-block text-left">
          <button (click)="toggleDropdown()" class="px-3 py-2 rounded-lg text-sm font-normal text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition-all bg-transparent border-0">
            Home ▾
          </button>

          <div *ngIf="isDropdownOpen" 
               class="absolute right-0 mt-2 w-48 rounded-md shadow-2xl bg-zinc-900 border border-zinc-800 py-1 z-50">
            
            <a routerLink="/data-binding" 
               (click)="closeDropdown()"
               routerLinkActive="bg-zinc-800 text-amber-400 font-medium"
               class="block px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-white transition-all no-underline">
              Data Binding
            </a>
            
            <a routerLink="/show-data" 
               (click)="closeDropdown()"
               routerLinkActive="bg-zinc-800 text-amber-400 font-medium"
               class="block px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-white transition-all no-underline">
              Show Data
            </a>
            
            <a routerLink="/HW1" 
               (click)="closeDropdown()"
               routerLinkActive="bg-zinc-800 text-amber-400 font-medium"
               class="block px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-white transition-all no-underline">
              HW1: Landmarks
            </a>
            
            <a routerLink="/HW2" 
               (click)="closeDropdown()"
               routerLinkActive="bg-zinc-800 text-amber-400 font-medium"
               class="block px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-white transition-all no-underline">
              HW2: Movies
            </a>
            
          </div>
        </div>

        <button class="px-3 py-2 rounded-lg text-sm font-normal text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition-all bg-transparent border-0">
          Story
        </button>
        <button class="px-3 py-2 rounded-lg text-sm font-normal text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition-all bg-transparent border-0">
          Episodes
        </button>
        <button class="px-3 py-2 rounded-lg text-sm font-normal text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition-all bg-transparent border-0">
          Videos
        </button>
        <button class="px-3 py-2 rounded-lg text-sm font-normal text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition-all bg-transparent border-0">
          Log out
        </button>

      </nav>

    </div>
  </div>
</header>

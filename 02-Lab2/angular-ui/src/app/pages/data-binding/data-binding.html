<div class="flex flex-col items-center gap-4 m-4">
  <div class="flex flex-row items-baseline gap-4">
    <input #inputText type="text" [(ngModel)]="textModel" class="input outline-0" />
    <button class="btn btn-dash" (click)="readText(inputText)">OK</button>
  </div>
  
  <div class="flex flex-row items-baseline gap-4">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">เลือกประเทศที่อยากไปเที่ยว</legend>
      <select class="select outline-0" [ngModel]="country()" (ngModelChange)="country.set($event)">
        <option value="ญี่ปุ่น">ญี่ปุ่น</option>
        <option value="เนเธอร์แลนด์">เนเธอร์แลนด์</option>
      </select>
    </fieldset>
    <div>
      {{ country() }}
    </div>
  </div>
</div>

<app-show-data [(textModelInShowData)]="textModel"></app-show-data>

<h2>{{landmarks[0].name}}</h2>
<h3>{{landmarks[0].country}}</h3>
<p>{{landmarks[0].detail}}</p>
<img src="{{landmarks[0].url}}">
